<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Big Plane Radar Location</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        background: #050805;
        color: #e8ffe8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      h1 { color: #73ff8a; font-size: 28px; }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 13px 18px;
        border: 0;
        background: #19d45a;
        color: #001b08;
        font-weight: 700;
        cursor: pointer;
      }
      #status { min-height: 48px; color: #a8bbaa; }
    </style>
  </head>
  <body>
    <h1>Radar location</h1>
    <p>Allow location access, then the coordinates will be returned to your Plane Radar setup page.</p>
    <button id="locate" type="button">Use this location</button>
    <p id="status"></p>
    <script>
      const status = document.getElementById("status");
      const returnValue = new URLSearchParams(location.search).get("return");

      function isPrivateRadarUrl(value) {
        try {
          const url = new URL(value);
          const host = url.hostname.toLowerCase();
          const parts = host.split(".").map(Number);
          const privateIpv4 = parts.length === 4 && parts.every(Number.isInteger) && (
            parts[0] === 10 ||
            parts[0] === 127 ||
            (parts[0] === 169 && parts[1] === 254) ||
            (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
            (parts[0] === 192 && parts[1] === 168)
          );
          return url.protocol === "http:" &&
            (host === "localhost" || host.endsWith(".local") || privateIpv4);
        } catch (_) {
          return false;
        }
      }

      document.getElementById("locate").addEventListener("click", () => {
        if (!isPrivateRadarUrl(returnValue)) {
          status.textContent = "Open this page from the Plane Radar setup page.";
          return;
        }
        if (!navigator.geolocation) {
          status.textContent = "This browser does not provide geolocation.";
          return;
        }

        status.textContent = "Locating...";
        navigator.geolocation.getCurrentPosition((position) => {
          const target = new URL(returnValue);
          target.searchParams.set("browser_lat", position.coords.latitude.toFixed(6));
          target.searchParams.set("browser_lon", position.coords.longitude.toFixed(6));
          status.textContent = "Location found. Returning to Plane Radar...";
          location.replace(target.toString());
        }, (error) => {
          status.textContent = `Location unavailable: ${error.message}`;
        }, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 60000
        });
      });
    </script>
  </body>
</html>
