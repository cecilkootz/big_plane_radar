<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">Big Plane Radar Aircraft Symbol Legend</title>
  <desc id="desc">Comparison of detailed yellow aircraft icons and classic red symbols for small, normal, large, and rotorcraft targets.</desc>
  <defs>
    <image id="plane-small" width="15" height="15" href="data:image/png;base64,"/>
    <image id="plane-normal" width="20" height="20" href="data:image/png;base64,"/>
    <image id="plane-large" width="25" height="25" href="data:image/png;base64,"/>
    <image id="helicopter" width="20" height="20" href="data:image/png;base64,"/>
    <style>
      .title { fill: #ebffee; font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #6ebe91; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #ebffee; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .meta { fill: #6ebe91; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mode { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .panel { fill: #061411; stroke: #0b3a29; stroke-width: 2; }
      .divider { stroke: #103f2f; stroke-width: 1; }
      .classic { fill: #ff3750; stroke: #ff3750; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="920" height="600" fill="#020807"/>
  <text x="32" y="42" class="title">Aircraft Symbol Legend</text>
  <text x="32" y="66" class="subtitle">Selectable detailed icons and classic symbols use the same ADS-B category sizing.</text>

  <g transform="translate(32 88)">
    <rect class="panel" width="416" height="220" rx="6"/>
    <text x="20" y="31" class="label">Small aircraft</text>
    <text x="20" y="53" class="meta">A1, A2, B*</text>
    <line class="divider" x1="20" y1="69" x2="396" y2="69"/>
    <line class="divider" x1="208" y1="84" x2="208" y2="201"/>
    <text x="24" y="98" class="mode" fill="#ffdc38">DETAILED ICON</text>
    <use href="#plane-small" x="89" y="126" width="30" height="30"/>
    <text x="228" y="98" class="mode" fill="#ff5b70">CLASSIC SYMBOL</text>
    <g transform="translate(312 147) scale(1.7)">
      <polygon class="classic" points="0,-9 5,6 -5,6"/>
    </g>
  </g>

  <g transform="translate(472 88)">
    <rect class="panel" width="416" height="220" rx="6"/>
    <text x="20" y="31" class="label">Normal aircraft</text>
    <text x="20" y="53" class="meta">A3, A6, unknown</text>
    <line class="divider" x1="20" y1="69" x2="396" y2="69"/>
    <line class="divider" x1="208" y1="84" x2="208" y2="201"/>
    <text x="24" y="98" class="mode" fill="#ffdc38">DETAILED ICON</text>
    <use href="#plane-normal" x="84" y="121" width="40" height="40"/>
    <text x="228" y="98" class="mode" fill="#ff5b70">CLASSIC SYMBOL</text>
    <g transform="translate(312 147) scale(1.7)">
      <polygon class="classic" points="0,-12 6,8 -6,8"/>
    </g>
  </g>

  <g transform="translate(32 328)">
    <rect class="panel" width="416" height="220" rx="6"/>
    <text x="20" y="31" class="label">Large aircraft</text>
    <text x="20" y="53" class="meta">A4, A5</text>
    <line class="divider" x1="20" y1="69" x2="396" y2="69"/>
    <line class="divider" x1="208" y1="84" x2="208" y2="201"/>
    <text x="24" y="98" class="mode" fill="#ffdc38">DETAILED ICON</text>
    <use href="#plane-large" x="79" y="116" width="50" height="50"/>
    <text x="228" y="98" class="mode" fill="#ff5b70">CLASSIC SYMBOL</text>
    <g transform="translate(312 147) scale(1.7)">
      <polygon class="classic" points="0,-15 8,10 -8,10"/>
    </g>
  </g>

  <g transform="translate(472 328)">
    <rect class="panel" width="416" height="220" rx="6"/>
    <text x="20" y="31" class="label">Helicopter</text>
    <text x="20" y="53" class="meta">A7, tail points backward</text>
    <line class="divider" x1="20" y1="69" x2="396" y2="69"/>
    <line class="divider" x1="208" y1="84" x2="208" y2="201"/>
    <text x="24" y="98" class="mode" fill="#ffdc38">DETAILED ICON</text>
    <use href="#helicopter" x="84" y="121" width="40" height="40"/>
    <text x="228" y="98" class="mode" fill="#ff5b70">CLASSIC SYMBOL</text>
    <g transform="translate(312 144) scale(2.2)" stroke-width="2">
      <line class="classic" x1="-3" y1="-3" x2="3" y2="3"/>
      <line class="classic" x1="-3" y1="3" x2="3" y2="-3"/>
      <line class="classic" x1="0" y1="0" x2="0" y2="7"/>
    </g>
  </g>

  <text x="32" y="579" class="subtitle">All symbols rotate with heading. Detailed icons use precomputed anti-aliased 5° frames.</text>
</svg>
